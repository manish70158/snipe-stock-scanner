name: Weekly SNIPE Scan

on:
  schedule:
    # Run every Saturday at 12:00 UTC (5:30 PM IST) - after market week ends
    - cron: '0 12 * * 6'
  workflow_dispatch: # Allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Fetch Nifty 500 data
        run: snipe fetch --symbols 500

      - name: Run SNIPE scan
        id: scan
        run: |
          # Run scan and capture JSON output
          snipe scan --json > scan_result.json
          echo "Scan complete. Result:"
          cat scan_result.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Watchlist: {len(d.get(\"watchlist\",[]))} stocks')"

          # Also run regime check (non-critical)
          snipe regime --json > regime_result.json 2>/dev/null || echo '{}' > regime_result.json

      - name: Format and send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import json
          import requests
          import os
          from datetime import datetime

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          # Load scan results
          with open("scan_result.json") as f:
              scan = json.load(f)

          # Load regime results
          try:
              with open("regime_result.json") as f:
                  regime = json.load(f)
          except Exception:
              regime = {}

          # Format message using HTML parse mode (avoids Markdown escaping issues)
          date = scan.get("scan_date", datetime.now().strftime("%Y-%m-%d"))
          counts = scan.get("stage_counts", {})
          watchlist = scan.get("watchlist", [])
          regime_status = scan.get("regime", "unknown").upper()

          msg = f"📊 <b>SNIPE Weekly Scan — {date}</b>\n\n"
          msg += f"<b>Market Regime:</b> <code>{regime_status}</code>\n"
          msg += f"<b>Pipeline:</b> {counts.get('universe', 0)} → {counts.get('trend_template', 0)} → {counts.get('pattern_detection', 0)} → {counts.get('fundamental_screen', 0)} → <b>{counts.get('final_watchlist', 0)}</b>\n\n"

          if not watchlist:
              msg += "⚠️ No candidates found this week.\n"
          else:
              # Summary table
              msg += "<b>🎯 Watchlist Summary:</b>\n"
              msg += "<pre>\n"
              msg += f"{'#':<2} {'Symbol':<10} {'CMP':<6} {'Entry':<6} {'SL':<6} {'T1':<6} {'T2':<6}\n"
              msg += "-" * 50 + "\n"
              for item in watchlist:
                  sizing = item.get("position_sizing", {})
                  t1 = sizing.get("target_1", 0)
                  t2 = sizing.get("target_2", 0)
                  msg += (
                      f"{item.get('rank', ''):<2} "
                      f"{item['symbol']:<10} "
                      f"{item.get('current_price', 0):<6.0f} "
                      f"{item.get('pivot_price', 0):<6.0f} "
                      f"{item.get('stop_price', 0):<6.0f} "
                      f"{t1:<6.0f} "
                      f"{t2:<6.0f}\n"
                  )
              msg += "</pre>\n\n"

              # Scoring metrics table
              msg += "<b>📈 Scoring Metrics:</b>\n"
              msg += "<pre>\n"
              msg += f"{'#':<2} {'Symbol':<10} {'Score':<5} {'TT':<5} {'VCP':<5} {'Edg':<4} {'Sec':<3} {'Stage':<6}\n"
              msg += "-" * 52 + "\n"
              for item in watchlist:
                  # Shorten stage name for table
                  stage_raw = item.get('stage', '?')
                  stage_map = {
                      "stage_2": "S2",
                      "stage_2_early": "S2-E",
                      "stage_1": "S1",
                      "stage_3": "S3",
                      "stage_4": "S4",
                  }
                  stage_short = stage_map.get(stage_raw, stage_raw[:6])
                  # Sector trend indicator
                  sec_trend = "↑" if item.get("sector_trending") else "→"
                  msg += (
                      f"{item.get('rank', ''):<2} "
                      f"{item['symbol']:<10} "
                      f"{item.get('composite_score', 0):<5.0f} "
                      f"{item.get('trend_template_score', 0):<2}/10 "
                      f"{item.get('vcp_quality', 0):<2.0f}/10 "
                      f"{item.get('edge_count', 0):<4} "
                      f"{sec_trend:<3} "
                      f"{stage_short:<6}\n"
                  )
              msg += "</pre>\n"
              msg += "<i>Sec: ↑=leading sector →=neutral</i>\n\n"

              # CANSLIM detail table
              msg += "<b>📋 CANSLIM Breakdown:</b>\n"
              msg += "<pre>\n"
              msg += f"{'#':<2} {'Symbol':<10} {'C':>2} {'A':>2} {'N':>2} {'S':>2} {'L':>2} {'I':>2} {'M':>2}  {'Tot':<4}\n"
              msg += "-" * 42 + "\n"
              for item in watchlist:
                  canslim = item.get("canslim_detail", {})
                  def _mark(val):
                      if val is True:
                          return "✓"
                      elif val == "data_unavailable":
                          return "–"
                      else:
                          return "✗"
                  c = _mark(canslim.get("C"))
                  a = _mark(canslim.get("A"))
                  n = _mark(canslim.get("N"))
                  s = _mark(canslim.get("S"))
                  l = _mark(canslim.get("L"))
                  i = _mark(canslim.get("I"))
                  m = _mark(canslim.get("M"))
                  total = item.get("canslim_score", 0)
                  msg += (
                      f"{item.get('rank', ''):<2} "
                      f"{item['symbol']:<10} "
                      f"{c:>2} {a:>2} {n:>2} {s:>2} {l:>2} {i:>2} {m:>2}"
                      f"  {total}/7\n"
                  )
              msg += "</pre>\n"
              msg += "<i>C=Earnings A=Annual N=NewHigh S=Supply L=Leader I=Inst M=Market</i>\n\n"

              # Position sizing table
              msg += "<b>💰 Position Sizing:</b>\n"
              msg += "<pre>\n"
              msg += f"{'#':<2} {'Symbol':<10} {'Qty':<6} {'Value':<8} {'Risk%':<6} {'R:R':<4}\n"
              msg += "-" * 40 + "\n"
              for item in watchlist:
                  sizing = item.get("position_sizing", {})
                  if sizing.get("valid"):
                      msg += (
                          f"{item.get('rank', ''):<2} "
                          f"{item['symbol']:<10} "
                          f"{sizing.get('shares', 0):<6} "
                          f"{sizing.get('position_value', 0):<8.0f} "
                          f"{sizing.get('risk_percent', 0):<6.1f} "
                          f"{sizing.get('risk_reward_ratio', 0):<4.1f}\n"
                      )
                  else:
                      msg += (
                          f"{item.get('rank', ''):<2} "
                          f"{item['symbol']:<10} "
                          f"{'--':<6} "
                          f"{'--':<8} "
                          f"{'--':<6} "
                          f"{sizing.get('reason', 'N/A')}\n"
                      )
              msg += "</pre>\n\n"

              # Maximum Conviction Alert (4+ edges)
              max_conviction = [item for item in watchlist if item.get("edge_count", 0) >= 4]
              if max_conviction:
                  msg += "🚨🚨🚨 <b>MAXIMUM CONVICTION ALERT</b> 🚨🚨🚨\n"
                  msg += "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
                  msg += "<b>4+ Edges Detected — 2% Risk Allocation</b>\n\n"
                  for item in max_conviction:
                      edges_list = item.get("edges", [])
                      edges_str = ", ".join(edges_list) or "none"
                      sizing = item.get("position_sizing", {})
                      t1 = sizing.get("target_1", 0)
                      t2 = sizing.get("target_2", 0)
                      msg += f"  ⚡ <b>{item['symbol']}</b> — {item.get('edge_count', 0)} EDGES\n"
                      msg += f"     Entry: ₹{item.get('pivot_price', 0):.0f} | SL: ₹{item.get('stop_price', 0):.0f} | T1: ₹{t1:.0f} | T2: ₹{t2:.0f}\n"
                      msg += f"     Edges: [{edges_str}]\n"
                      msg += f"     Score: {item.get('composite_score', 0):.0f}/100 | VCP: {item.get('vcp_quality', 0):.0f}/10 | RS: Top {100 - item.get('rs_percentile', 50):.0f}%\n"
                      if sizing.get("valid"):
                          msg += f"     Size: {sizing.get('shares', 0)} shares (₹{sizing.get('position_value', 0):,.0f}) | Risk: 2.0%\n"
                      msg += "\n"
                  msg += "  <i>⚠️ Backtest: 4-edge setups = 86% win rate, +1.03R avg</i>\n"
                  msg += "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n"

              # Edges detail
              msg += "<b>🔑 Edges Detail:</b>\n"
              for item in watchlist:
                  edges_str = ", ".join(item.get("edges", [])) or "none"
                  stage = item.get("stage", "?")
                  bo = "BO" if item.get("breakout_detected") else "Near" if item.get("approaching_breakout") else "Wait"
                  conviction = " 🔥" if item.get("edge_count", 0) >= 4 else ""
                  msg += f"  {item.get('rank', '')}. <b>{item['symbol']}</b>: [{edges_str}] | {stage} | {bo}{conviction}\n"

          msg += f"\n<i>Scan completed at {datetime.now().strftime('%H:%M UTC')}</i>"

          # Send to Telegram using HTML parse mode
          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }

          resp = requests.post(url, json=payload)
          if resp.status_code == 200:
              print("Telegram message sent successfully!")
          else:
              print(f"Failed to send: {resp.status_code} - {resp.text}")
              # Fallback: send without formatting
              payload["text"] = msg.replace("<b>", "").replace("</b>", "").replace("<i>", "").replace("</i>", "").replace("<pre>", "").replace("</pre>", "").replace("<code>", "").replace("</code>", "")
              del payload["parse_mode"]
              resp2 = requests.post(url, json=payload)
              if resp2.status_code == 200:
                  print("Sent without formatting (fallback).")
              else:
                  print(f"Fallback also failed: {resp2.status_code} - {resp2.text}")
          EOF

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: |
            scan_result.json
            regime_result.json
          retention-days: 90

      - name: Upload database as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snipe-db-${{ github.run_number }}
          path: snipe.db
          retention-days: 90
