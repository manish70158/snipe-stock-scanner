name: Weekly SNIPE Scan

on:
  schedule:
    # Run every Saturday at 12:00 UTC (5:30 PM IST) - after market week ends
    - cron: '0 12 * * 6'
  workflow_dispatch: # Allow manual trigger
    inputs:
      force_fundamentals:
        description: 'Force fundamentals refresh (ignore cache)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Restore previous database (if exists)
        uses: dawidd6/action-download-artifact@v2
        continue-on-error: true  # First run won't have artifacts
        with:
          workflow: weekly-scan.yml
          name_is_regexp: true
          name: snipe-db-.*
          path: .
          if_no_artifact_found: ignore

      - name: Use most recent database
        run: |
          # Find the most recent database artifact (if any)
          if [ -d "snipe-db-"* ] 2>/dev/null; then
            LATEST=$(ls -dt snipe-db-* | head -1)
            if [ -f "$LATEST/snipe.db" ]; then
              cp "$LATEST/snipe.db" snipe.db
              echo "✓ Restored database from $LATEST"

              # Show fundamentals count
              COUNT=$(sqlite3 snipe.db "SELECT COUNT(*) FROM fundamentals" 2>/dev/null || echo "0")
              echo "  Fundamentals data: $COUNT records"
            fi
          else
            echo "No previous database found. Starting fresh."
          fi

      - name: Fetch Nifty 500 price data
        run: snipe fetch --symbols 500

      - name: Fetch fundamentals data (CANSLIM C, A, I)
        run: |
          # Check if we need a full refresh
          FUND_COUNT=$(sqlite3 snipe.db "SELECT COUNT(*) FROM fundamentals" 2>/dev/null || echo "0")
          FUND_AGE=$(sqlite3 snipe.db "SELECT julianday('now') - julianday(MAX(last_updated)) FROM fundamentals" 2>/dev/null || echo "999")
          FORCE_REFRESH="${{ github.event.inputs.force_fundamentals }}"

          echo "Current fundamentals: $FUND_COUNT records"
          echo "Age: $FUND_AGE days"
          echo "Force refresh: $FORCE_REFRESH"

          # Full refresh if:
          # 1. Forced by user input
          # 2. Empty database (< 100 records)
          # 3. Stale data (> 30 days old)
          if [ "$FORCE_REFRESH" = "true" ] || [ "$FUND_COUNT" -lt 100 ] || [ $(echo "$FUND_AGE > 30" | bc -l 2>/dev/null || echo "1") -eq 1 ]; then
            echo "📊 Running FULL fundamentals refresh (all 500 stocks)"
            echo "This will take ~8-9 minutes..."
            snipe fetch-fundamentals --symbols 500 --delay 1
          else
            echo "✓ Fundamentals data is recent. Skipping fetch."
            echo "  (Force refresh from Actions UI if needed after earnings season)"
          fi
        continue-on-error: true  # Don't fail workflow if some stocks fail
        timeout-minutes: 15  # Safety timeout

      - name: Run SNIPE scan
        id: scan
        run: |
          # Run scan and capture JSON output
          snipe scan --json > scan_result.json
          echo "Scan complete. Result:"
          cat scan_result.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Watchlist: {len(d.get(\"watchlist\",[]))} stocks')"

          # Also run regime check (non-critical)
          snipe regime --json > regime_result.json 2>/dev/null || echo '{}' > regime_result.json

      - name: Format and send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import json
          import requests
          import os
          from datetime import datetime

          bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          # Load scan results
          with open("scan_result.json") as f:
              scan = json.load(f)

          # Load regime results
          try:
              with open("regime_result.json") as f:
                  regime = json.load(f)
          except Exception:
              regime = {}

          # Check fundamentals data status
          import subprocess
          try:
              fund_count = subprocess.check_output(
                  ["sqlite3", "snipe.db", "SELECT COUNT(*) FROM fundamentals"],
                  text=True
              ).strip()
              fund_status = f"({fund_count} stocks)" if int(fund_count) > 0 else "(no data)"
          except:
              fund_status = "(unknown)"

          # Format message using HTML parse mode (avoids Markdown escaping issues)
          date = scan.get("scan_date", datetime.now().strftime("%Y-%m-%d"))
          counts = scan.get("stage_counts", {})
          watchlist = scan.get("watchlist", [])
          regime_status = scan.get("regime", "unknown").upper()

          msg = f"📊 <b>SNIPE Weekly Scan — {date}</b>\n\n"
          msg += f"<b>Market Regime:</b> <code>{regime_status}</code>\n"
          msg += f"<b>Fundamentals:</b> <code>{fund_status}</code>\n"
          msg += f"<b>Pipeline:</b> {counts.get('universe', 0)} → {counts.get('trend_template', 0)} → {counts.get('pattern_detection', 0)} → {counts.get('fundamental_screen', 0)} → <b>{counts.get('final_watchlist', 0)}</b>\n\n"

          if not watchlist:
              msg += "⚠️ No candidates found this week.\n"
          else:
              # Summary table (MD Framework: 2R/3R/4R targets)
              msg += "<b>🎯 Watchlist Summary:</b>\n"
              msg += "<pre>\n"
              msg += f"{'#':<2} {'Symbol':<10} {'CMP':<6} {'Entry':<6} {'SL':<6} {'T1(2R)':<7} {'T2(3R)':<7}\n"
              msg += "-" * 52 + "\n"
              for item in watchlist:
                  sizing = item.get("position_sizing", {})
                  t1 = sizing.get("target_1", 0)
                  t2 = sizing.get("target_2", 0)
                  msg += (
                      f"{item.get('rank', ''):<2} "
                      f"{item['symbol']:<10} "
                      f"{item.get('current_price', 0):<6.0f} "
                      f"{item.get('pivot_price', 0):<6.0f} "
                      f"{item.get('stop_price', 0):<6.0f} "
                      f"{t1:<7.0f} "
                      f"{t2:<7.0f}\n"
                  )
              msg += "</pre>\n"
              msg += "<i>MD Framework: Minimum R:R = 2:1 (T1), Ideal = 3:1 (T2)</i>\n\n"

              # Scoring metrics table
              msg += "<b>📈 Scoring Metrics:</b>\n"
              msg += "<pre>\n"
              msg += f"{'#':<2} {'Symbol':<10} {'Score':<5} {'TT':<5} {'VCP':<5} {'Edg':<4} {'Sec':<3} {'Stage':<6}\n"
              msg += "-" * 52 + "\n"
              for item in watchlist:
                  # Shorten stage name for table
                  stage_raw = item.get('stage', '?')
                  stage_map = {
                      "stage_2": "S2",
                      "stage_2_early": "S2-E",
                      "stage_1": "S1",
                      "stage_3": "S3",
                      "stage_4": "S4",
                  }
                  stage_short = stage_map.get(stage_raw, stage_raw[:6])
                  # Sector trend indicator
                  sec_trend = "↑" if item.get("sector_trending") else "→"
                  msg += (
                      f"{item.get('rank', ''):<2} "
                      f"{item['symbol']:<10} "
                      f"{item.get('composite_score', 0):<5.0f} "
                      f"{item.get('trend_template_score', 0):<2}/10 "
                      f"{item.get('vcp_quality', 0):<2.0f}/10 "
                      f"{item.get('edge_count', 0):<4} "
                      f"{sec_trend:<3} "
                      f"{stage_short:<6}\n"
                  )
              msg += "</pre>\n"
              msg += "<i>Sec: ↑=leading sector →=neutral</i>\n\n"

              # CANSLIM detail table
              msg += "<b>📋 CANSLIM Breakdown:</b>\n"
              msg += "<pre>\n"
              msg += f"{'#':<2} {'Symbol':<10} {'C':>2} {'A':>2} {'N':>2} {'S':>2} {'L':>2} {'I':>2} {'M':>2}  {'Tot':<4}\n"
              msg += "-" * 42 + "\n"
              for item in watchlist:
                  canslim = item.get("canslim_detail", {})
                  def _mark(val):
                      if val is True:
                          return "✓"
                      elif val == "data_unavailable":
                          return "–"
                      else:
                          return "✗"
                  c = _mark(canslim.get("C"))
                  a = _mark(canslim.get("A"))
                  n = _mark(canslim.get("N"))
                  s = _mark(canslim.get("S"))
                  l = _mark(canslim.get("L"))
                  i = _mark(canslim.get("I"))
                  m = _mark(canslim.get("M"))
                  total = item.get("canslim_score", 0)
                  msg += (
                      f"{item.get('rank', ''):<2} "
                      f"{item['symbol']:<10} "
                      f"{c:>2} {a:>2} {n:>2} {s:>2} {l:>2} {i:>2} {m:>2}"
                      f"  {total}/7\n"
                  )
              msg += "</pre>\n"
              msg += "<i>C=Earnings A=Annual N=NewHigh S=Supply L=Leader I=Inst M=Market</i>\n\n"

              # Position sizing table (MD Framework)
              msg += "<b>💰 Position Sizing:</b>\n"
              msg += "<pre>\n"
              msg += f"{'#':<2} {'Symbol':<10} {'Edges':<6} {'Qty':<6} {'Value':<8} {'Risk%':<6} {'R:R':<4}\n"
              msg += "-" * 48 + "\n"
              for item in watchlist:
                  sizing = item.get("position_sizing", {})
                  edge_count = item.get("edge_count", 0)
                  if sizing.get("valid"):
                      msg += (
                          f"{item.get('rank', ''):<2} "
                          f"{item['symbol']:<10} "
                          f"{edge_count:<6} "
                          f"{sizing.get('shares', 0):<6} "
                          f"{sizing.get('position_value', 0):<8.0f} "
                          f"{sizing.get('risk_percent', 0):<6.1f} "
                          f"{sizing.get('risk_reward_ratio', 0):<4.1f}\n"
                      )
                  else:
                      reason = sizing.get('reason', 'N/A')
                      # Translate reason codes to readable messages
                      reason_map = {
                          "insufficient_edges": "WATCH",
                          "stop_too_wide": ">8%SL",
                          "market_regime_red": "REGIME",
                      }
                      reason_short = reason_map.get(reason, reason[:10])
                      msg += (
                          f"{item.get('rank', ''):<2} "
                          f"{item['symbol']:<10} "
                          f"{edge_count:<6} "
                          f"{'--':<6} "
                          f"{'--':<8} "
                          f"{'--':<6} "
                          f"{reason_short}\n"
                      )
              msg += "</pre>\n"
              msg += "<i>MD: 2e=0.5%/5%, 3e=1%/8%, 4e=1.5%/12% | WATCH=1 edge (watchlist only)</i>\n\n"

              # Maximum Conviction Alert (4 edges — MD Framework)
              max_conviction = [item for item in watchlist if item.get("edge_count", 0) == 4]
              if max_conviction:
                  msg += "🚨🚨🚨 <b>MAXIMUM CONVICTION ALERT</b> 🚨🚨🚨\n"
                  msg += "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"
                  msg += "<b>4 Edges Detected — 1.5% Risk Allocation</b>\n\n"
                  for item in max_conviction:
                      edges_list = item.get("edges", [])
                      edges_str = ", ".join(edges_list) or "none"
                      sizing = item.get("position_sizing", {})
                      t1 = sizing.get("target_1", 0)
                      t2 = sizing.get("target_2", 0)
                      t3 = sizing.get("target_3", 0)
                      msg += f"  ⚡ <b>{item['symbol']}</b> — 4 EDGES\n"
                      msg += f"     Entry: ₹{item.get('pivot_price', 0):.0f} | SL: ₹{item.get('stop_price', 0):.0f} | T1: ₹{t1:.0f} (2R) | T2: ₹{t2:.0f} (3R) | T3: ₹{t3:.0f} (4R)\n"
                      msg += f"     Edges: [{edges_str}]\n"
                      msg += f"     Score: {item.get('composite_score', 0):.0f}/100 | VCP: {item.get('vcp_quality', 0):.0f}/10 | RS: Top {100 - item.get('rs_percentile', 50):.0f}%\n"
                      if sizing.get("valid"):
                          risk_pct = sizing.get('risk_percent', 1.5)
                          msg += f"     Size: {sizing.get('shares', 0)} shares (₹{sizing.get('position_value', 0):,.0f}) | Risk: {risk_pct:.1f}% | Position: {sizing.get('position_pct_of_equity', 0):.1f}%\n"
                      msg += "\n"
                  msg += "  <i>⚠️ Backtest: 4-edge setups = 86% win rate, +1.03R avg</i>\n"
                  msg += "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n"

              # Edges detail (MD Framework: 4-edge system)
              msg += "<b>🔑 Edges Detail (HV1, HVE, RS, N-Factor):</b>\n"
              for item in watchlist:
                  edges_str = ", ".join(item.get("edges", [])) or "none"
                  edge_count = item.get("edge_count", 0)
                  stage = item.get("stage", "?")
                  bo = "BO" if item.get("breakout_detected") else "Near" if item.get("approaching_breakout") else "Wait"

                  # MD Framework edge markers
                  if edge_count == 4:
                      conviction = " 🔥🔥🔥 MAX"
                  elif edge_count == 3:
                      conviction = " 🔥🔥"
                  elif edge_count == 2:
                      conviction = " ✓"
                  elif edge_count == 1:
                      conviction = " ⚠️ WATCHLIST ONLY"
                  else:
                      conviction = " ✗ SKIP"

                  msg += f"  {item.get('rank', '')}. <b>{item['symbol']}</b>: [{edges_str}]{conviction} | {stage} | {bo}\n"

              msg += "\n<i>MD Framework: Min 2 edges to trade. 2e=0.5%, 3e=1%, 4e=1.5% risk</i>\n"

          msg += f"\n<i>Scan completed at {datetime.now().strftime('%H:%M UTC')}</i>"

          # Send to Telegram using HTML parse mode
          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          }

          resp = requests.post(url, json=payload)
          if resp.status_code == 200:
              print("Telegram message sent successfully!")
          else:
              print(f"Failed to send: {resp.status_code} - {resp.text}")
              # Fallback: send without formatting
              payload["text"] = msg.replace("<b>", "").replace("</b>", "").replace("<i>", "").replace("</i>", "").replace("<pre>", "").replace("</pre>", "").replace("<code>", "").replace("</code>", "")
              del payload["parse_mode"]
              resp2 = requests.post(url, json=payload)
              if resp2.status_code == 200:
                  print("Sent without formatting (fallback).")
              else:
                  print(f"Fallback also failed: {resp2.status_code} - {resp2.text}")
          EOF

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: |
            scan_result.json
            regime_result.json
          retention-days: 90

      - name: Upload database as artifact
        uses: actions/upload-artifact@v4
        with:
          name: snipe-db-${{ github.run_number }}
          path: snipe.db
          retention-days: 90
